services:
  trainer:
    build: .
    command: python main.py
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    depends_on:
      trainer:
        condition: service_completed_successfully

  dashboard:
    build: .
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    depends_on:
      trainer:
        condition: service_completed_successfully
